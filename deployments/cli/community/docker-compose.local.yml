# Run Plane with locally built images:
#   backend  -> apps/api on branch feature/semantic-search (time tracking + search)
#   embedder -> apps/embedder (semantic search model, CPU only)
#   frontend -> branch feature/semantic-search-v1.4.2 (release v1.4.2 + time tracking, timesheet, search), built by CI
#   docker compose -p plane --env-file plane.env -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  web:
    image: plane-frontend:v142
  api:
    image: plane-backend:local
    environment:
      EMBEDDER_URL: http://embedder:8000
  worker:
    image: plane-backend:local
  beat-worker:
    image: plane-backend:local
  migrator:
    image: plane-backend:local
  embedder:
    image: plane-embedder:local
    restart: unless-stopped
